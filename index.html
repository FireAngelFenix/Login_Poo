<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iniciar sesión</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <h1>Bienvenido de nuevo</h1>
  <p class="sub">Inicia sesión para continuar.</p>

  <form id="login" novalidate>
    <div class="field">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" name="email" autocomplete="username" placeholder="nombre@ejemplo.com" required>
      <p class="err" id="email-err" role="alert"></p>
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" autocomplete="current-password" required minlength="6">
        <button type="button" class="toggle" id="toggle" aria-controls="password" aria-pressed="false">Mostrar</button>
      </div>
      <p class="err" id="password-err" role="alert"></p>
    </div>

    <div class="row">
      <label class="check">
        <input type="checkbox" id="remember"> Mantener sesión iniciada
      </label>
      <a href="#">Olvidé mi contraseña</a>
    </div>

    <button type="submit" class="submit" id="submit">Iniciar sesión</button>
    <p class="status" id="status" role="status"></p>
  </form>

  <p class="foot">¿No tienes cuenta? <a href="#">Crear cuenta</a></p>
</main>

<script src="script.js"></script>
</body>
</html>
